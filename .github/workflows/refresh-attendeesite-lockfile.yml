name: Refresh AttendeeSite lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate npm lockfile
        working-directory: code/src/AttendeeSite
        run: npm install --package-lock-only --ignore-scripts

      - name: Update form-data to a patched 2.x release
        working-directory: code/src/AttendeeSite
        run: npm install --package-lock-only 'form-data@~2.5.6' --ignore-scripts

      - name: Validate lockfile
        working-directory: code/src/AttendeeSite
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8')); console.log('Lockfile JSON is valid')"

      - name: Commit updated dependency files
        run: |
          if git diff --quiet -- code/src/AttendeeSite/package.json code/src/AttendeeSite/package-lock.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/AttendeeSite/package.json code/src/AttendeeSite/package-lock.json
          git commit -m "Fix AttendeeSite form-data vulnerability"
          git push
